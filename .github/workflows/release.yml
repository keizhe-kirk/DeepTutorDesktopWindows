name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

env:
  TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}

jobs:
  build-windows:
    name: Build Windows installer
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      # 快速失败:没有签名密钥就别跑 25 分钟构建了。
      # 缺密钥会导致安装包不带 .sig、latest.json 的 signature 为空,
      # 届时 tauri-plugin-updater 校验必然失败 —— 自动更新形同虚设。
      - name: Check updater signing key is configured
        shell: pwsh
        run: |
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY) {
            throw "缺少仓库 Secret: TAURI_SIGNING_PRIVATE_KEY —— 自动更新会因签名校验失败而不可用。请在 Settings → Secrets and variables → Actions 中配置 TAURI_SIGNING_PRIVATE_KEY 与 TAURI_SIGNING_PRIVATE_KEY_PASSWORD 后再发版。"
          }
          if (-not $env:TAURI_SIGNING_PRIVATE_KEY_PASSWORD) {
            throw "缺少仓库 Secret: TAURI_SIGNING_PRIVATE_KEY_PASSWORD —— 本项目的私钥带密码,缺失会导致签名步骤挂起等待输入直至超时。"
          }
          Write-Host "签名密钥已配置 (private key length = $($env:TAURI_SIGNING_PRIVATE_KEY.Length))"

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Install Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install pnpm
        run: npm install -g pnpm@11

      - name: Install frontend deps
        run: pnpm install

      # 组装自包含运行时:内置 CPython + deeptutor(含前端产物) + Node.js。
      # 产物落在 src-tauri/runtimes/,会被 bundle.resources 打进安装包,
      # 最终用户无需预装 Python 或 Node.js。
      - name: Cache assembled runtimes
        uses: actions/cache@v4
        with:
          path: |
            .cache/runtimes
            src-tauri/runtimes
          key: runtimes-${{ runner.os }}-${{ hashFiles('scripts/fetch-runtimes.ps1') }}-${{ hashFiles('requirements-shell.txt') }}

      - name: Assemble self-contained runtimes (Python + Node + deeptutor)
        shell: pwsh
        run: ./scripts/fetch-runtimes.ps1

      # 设置了 TAURI_SIGNING_PRIVATE_KEY 时,tauri build 会自动对产物签名并生成 .sig
      # 只出 NSIS:MSI(WiX) 打包数千个运行时文件既慢又容易失败,且与 updater 的
      # passive 安装模式配合不如 NSIS。
      - name: Build Tauri bundle (NSIS, signed)
        run: pnpm tauri build --target x86_64-pc-windows-msvc
        timeout-minutes: 120

      - name: Generate updater manifest (latest.json)
        id: manifest
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $conf = Get-Content "src-tauri\tauri.conf.json" -Raw | ConvertFrom-Json
          $version = $conf.version
          $bundleRoot = "src-tauri\target\x86_64-pc-windows-msvc\release\bundle"
          $nsis = Get-ChildItem -Path $bundleRoot -Recurse -Filter "*.exe" |
            Where-Object { $_.FullName -match 'nsis' } | Select-Object -First 1
          if (-not $nsis) { throw "NSIS bundle not found" }

          # 精确匹配 <installer>.exe.sig。不要用"递归取第一个 *.sig":
          # 一旦将来多出别的签名产物(如 msi/*.msi.sig),就会把错误的签名写进 manifest,
          # 导致用户侧校验失败且极难排查。
          $sig = Get-Item -LiteralPath "$($nsis.FullName).sig" -ErrorAction SilentlyContinue
          $tag = $env:GITHUB_REF -replace 'refs/tags/',''
          $repo = $env:GITHUB_REPOSITORY
          $url = "https://github.com/$repo/releases/download/$tag/$($nsis.Name)"
          $pubDate = (Get-Date).ToUniversalTime().ToString("yyyy-MM-ddTHH:mm:ssZ")

          # 硬失败:宁可不发版,也不发一个 signature 为空、自动更新装不上的版本。
          # (Windows NSIS 的更新产物就是安装包本身 exe + exe.sig,由 createUpdaterArtifacts 生成)
          if (-not $sig) {
            throw "未找到签名文件 $($nsis.Name).sig。请确认 tauri.conf.json 里 bundle.createUpdaterArtifacts=true,且 TAURI_SIGNING_PRIVATE_KEY / _PASSWORD 已正确配置 —— 空签名的更新包会被 tauri-plugin-updater 拒绝。"
          }
          $signature = (Get-Content $sig.FullName -Raw).Trim()
          if ([string]::IsNullOrWhiteSpace($signature)) {
            throw "签名文件 $($sig.Name) 内容为空。"
          }
          Write-Host "Signature found: $($sig.Name) ($($signature.Length) chars)"

          $manifest = [ordered]@{
            version   = $version
            notes     = "See https://github.com/$repo/releases/tag/$tag"
            pub_date  = $pubDate
            platforms = [ordered]@{
              "windows-x86_64" = [ordered]@{
                signature = $signature
                url       = $url
              }
            }
          } | ConvertTo-Json -Depth 5

          $manifest | Out-File -FilePath "latest.json" -Encoding utf8
          "version=$version" >> $env:GITHUB_OUTPUT
          "nsis=$($nsis.FullName)" >> $env:GITHUB_OUTPUT
          Write-Host "latest.json generated for v$version"

      # 只出 NSIS,所以这里不再匹配 msi/*.msi(那个 glob 永远为空,只会在日志里刷警告)。
      # 一并上传 .sig,方便用户自行校验更新包签名。
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer
          path: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            latest.json

      - name: Create GitHub Release
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe
            src-tauri/target/x86_64-pc-windows-msvc/release/bundle/nsis/*.exe.sig
            latest.json
          draft: false
          prerelease: false
          generate_release_notes: true
