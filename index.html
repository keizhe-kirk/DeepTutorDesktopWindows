<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/png" href="/favicon.png" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>DeepTutor</title>
    <style>
      html, body { margin: 0; padding: 0; width: 100%; height: 100%;
        font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
        background: #f6f7f9; color: #1f2933; }
      #root { width: 100%; height: 100%; display: flex; align-items: center; justify-content: center; }
      .splash { text-align: center; }
      .logo { width: 64px; height: 64px; margin: 0 auto 16px;
        background-image: url('/logo.png'); background-size: cover; background-position: center;
        border-radius: 14px;
        box-shadow: 0 8px 24px rgba(29, 158, 117, 0.25); }
      .title { font-size: 18px; font-weight: 500; margin: 0 0 6px; }
      .subtitle { font-size: 13px; color: #6b7280; margin: 0; }
      .dots { display: inline-block; margin-left: 4px; }
      .dot { display: inline-block; width: 4px; height: 4px; border-radius: 50%;
        background: #1d9e75; margin: 0 1px; opacity: 0.3; animation: blink 1.2s infinite; }
      .dot:nth-child(2) { animation-delay: 0.4s; }
      .dot:nth-child(3) { animation-delay: 0.8s; }
      @keyframes blink { 0%, 100% { opacity: 0.3; } 50% { opacity: 1; } }
    </style>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
