[package]
name = "DeepTutorDesktopWin"
version = "0.1.7"
description = "Native Windows shell for HKUDS/DeepTutor"
authors = ["DeepTutor Contributors"]
edition = "2021"
rust-version = "1.78"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "deeptutor_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-autostart = "2.5"
tauri-plugin-updater = "2.11"
tauri-plugin-window-state = "2.4"
tauri-plugin-log = "2.9"
tauri-plugin-shell = "2.3"
tauri-plugin-os = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
parking_lot = "0.12"
which = "6"

[features]
# 默认关闭自定义协议需要时启用
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
