[package]
name = "DeepTutorDesktopWin"
version = "0.2.13"
description = "Native Windows shell for HKUDS/DeepTutor"
authors = ["DeepTutor Contributors"]
edition = "2021"
rust-version = "1.78"

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[lib]
name = "deeptutor_shell_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2.11", features = ["tray-icon", "image-png"] }
tauri-plugin-single-instance = "2.4"
tauri-plugin-autostart = "2.5"
tauri-plugin-updater = "2.11"
tauri-plugin-window-state = "2.4"
# 原生对话框:托盘菜单触发的更新流程需要它做「发现新版本,是否安装」的确认。
# 前端 IPC 侧不调用 dialog,所以 capabilities 里不需要额外授权。
tauri-plugin-dialog = "2"
tauri-plugin-log = "2.9"
tauri-plugin-shell = "2.3"
tauri-plugin-os = "2.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["process", "io-util", "macros", "rt-multi-thread", "time", "sync"] }
reqwest = { version = "0.12", features = ["json", "rustls-tls"], default-features = false }
anyhow = "1"
thiserror = "2"
log = "0.4"
chrono = { version = "0.4", features = ["serde"] }
dirs = "6"
parking_lot = "0.12"
which = "6"

# ---- 后端热更新(backend_updater)专用 ----
# PEP 508 依赖声明解析:wheel 的 METADATA 里 `Requires-Dist: foo>=1.2 ; python_version < "3.14"`
# 这种串要拆成 名称 / 版本约束 / 环境标记 三部分,还要对标记求值。
# 自己写正则能覆盖八成,但 marker 求值和 extras 语义边角太多 —— 交给 astral(uv 作者)的
# pep508_rs 更稳,它内部已经把 pep440 的版本比较一起带上了。
pep508_rs = "0.9"
pep440_rs = "0.7"
# wheel 本质就是个 zip 包(顶层直接是包目录,无 root 前缀)。
zip = { version = "2", default-features = false, features = ["deflate"] }
# 下载 wheel 后按 PyPI 给的 sha256 校验,防中间人 / 断流截断。
sha2 = "0.10"
hex = "0.4"
# CA 信任合并:把 Windows 证书库根编码进 PEM(见 backend/ca.rs)。
base64 = "0.22"

# Windows 作业对象(Job Object):保证壳进程消失时后端子进程树被内核一并回收。
# 见 backend/winproc.rs 的模块文档。
[target.'cfg(windows)'.dependencies]
windows = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Cryptography",
    "Win32_System_JobObjects",
    "Win32_System_Threading",
] }

[features]
# 默认关闭自定义协议需要时启用
default = []

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
